<script>
(function() {
  function updateCount() {
    var btn = document.querySelector('.wc-block-mini-cart__button');
    if (!btn) return;
    var text = btn.textContent || '';
    var m = text.match(/(\d+)/);
    var count = m ? parseInt(m[0], 10) : 0;
    var el = document.getElementById('se-mobile-cart-count');
    if (el) {
      if (count > 0) { el.textContent = count; el.style.display = 'flex'; }
      else { el.style.display = 'none'; }
    }
  }
  updateCount();
  document.addEventListener('wc_fragments_refreshed', updateCount);
  document.addEventListener('wc_fragments_loaded', updateCount);
  setTimeout(updateCount, 2000);
})();
(function(){var y=document.querySelector('.se-current-year');if(y)y.textContent=new Date().getFullYear();})();
</script>
